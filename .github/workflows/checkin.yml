name: iamhc Daily Checkin (Browser)

on:
  schedule:
    - cron: '0 23 * * *'   # UTC 23:00 = 北京时间次日 07:00
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---- 安装系统依赖：Xvfb + Chrome 运行库 ----
      - name: Install system deps
        run: |
          sudo apt-get update
          # Ubuntu 24.04 需要的依赖（已移除 libgconf-2-4）
          sudo apt-get install -y \
            xvfb \
            libxi6 \
            libnss3 \
            libxss1 \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libpangocairo-1.0-0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            fonts-liberation \
            xdg-utils

      - name: Install Google Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/chrome.deb || sudo apt-get install -f -y
          google-chrome --version

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install seleniumbase requests

      # ---- 运行签到脚本 ----
      - name: Run checkin
        env:
          EMAIL:        ${{ secrets.EMAIL }}
          PASSWORD:     ${{ secrets.PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python checkin_browser.py

      # ---- 失败时上传截图方便排查 ----
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: error_screenshot.png
          if-no-files-found: ignore

      # ---- 清理旧运行记录 ----
      - name: Clear old runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "deleted: $run_id"
              gh run delete $run_id || true
            fi
          done
